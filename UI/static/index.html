<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent UI</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #06060f;
      }

      body {
        font-family: "Avenir Next", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: rgba(255, 255, 255, 0.9);
      }

      .vo-root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 36px 20px;
        user-select: none;
      }

      .orb-stack {
        position: relative;
        width: 160px;
        height: 160px;
      }

      .ring1,
      .ring2,
      .ring3,
      .spinner-ring,
      .spinner-ring2 {
        position: absolute;
        border-radius: 50%;
      }

      @keyframes ringPulse1 {
        0%,
        100% {
          opacity: 0.18;
          transform: scale(1);
        }
        50% {
          opacity: 0.32;
          transform: scale(1.04);
        }
      }

      @keyframes ringPulse2 {
        0%,
        100% {
          opacity: 0.1;
          transform: scale(1);
        }
        50% {
          opacity: 0.2;
          transform: scale(1.08);
        }
      }

      .ring1 {
        inset: -28px;
        border: 1px solid rgba(167, 139, 250, 0.6);
        animation: ringPulse1 3s ease-in-out infinite;
      }

      .ring2 {
        inset: -52px;
        border: 1px solid rgba(124, 58, 237, 0.4);
        animation: ringPulse2 3s ease-in-out infinite 0.8s;
      }

      .ring3 {
        inset: -76px;
        border: 1px solid rgba(109, 40, 217, 0.2);
        animation: ringPulse2 3s ease-in-out infinite 1.6s;
      }

      @keyframes dashSpin {
        to {
          transform: rotate(360deg);
        }
      }

      .spinner-ring {
        inset: -22px;
        border: 1.5px solid transparent;
        border-top-color: rgba(196, 181, 253, 0.9);
        border-right-color: rgba(196, 181, 253, 0.3);
        animation: dashSpin 1.1s linear infinite;
      }

      .spinner-ring2 {
        inset: -34px;
        border: 1px solid transparent;
        border-bottom-color: rgba(124, 58, 237, 0.5);
        animation: dashSpin 1.8s linear infinite reverse;
      }

      @keyframes orbBreathe {
        0%,
        100% {
          filter: brightness(0.92);
        }
        50% {
          filter: brightness(1.08);
        }
      }

      @keyframes listenPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.4);
        }
        70% {
          box-shadow: 0 0 0 18px rgba(220, 38, 38, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
        }
      }

      @keyframes speakPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.4);
        }
        70% {
          box-shadow: 0 0 0 22px rgba(147, 51, 234, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(147, 51, 234, 0);
        }
      }

      .orb {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        transition:
          transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.5s ease,
          background 0.5s ease;
      }

      .orb-idle {
        animation: orbBreathe 4s ease-in-out infinite;
      }

      .orb-listening {
        animation: listenPulse 1.4s ease-out infinite;
      }

      .orb-speaking {
        animation: speakPulse 1.1s ease-out infinite;
      }

      .wave-wrap {
        margin-top: 28px;
        height: 52px;
        transition: opacity 0.6s ease;
      }

      .transcript-wrap {
        width: min(300px, calc(100vw - 32px));
        height: 108px;
        overflow: hidden;
        position: relative;
        margin-top: 6px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 100%);
        mask-image: linear-gradient(to bottom, transparent 0%, #000 22%, #000 100%);
      }

      .transcript-inner {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 8px;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes txFadeUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes txBlink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .tx-line {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        animation: txFadeUp 0.35s ease forwards;
      }

      .tx-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        margin-top: 5px;
        flex-shrink: 0;
      }

      .tx-text {
        font-family: ui-monospace, "SFMono-Regular", SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.42);
        transition: color 0.5s ease;
        word-break: break-word;
      }

      .tx-line.last .tx-text {
        color: rgba(255, 255, 255, 0.75);
      }

      .tx-cursor {
        display: inline-block;
        width: 1px;
        height: 11px;
        background: currentColor;
        margin-left: 2px;
        vertical-align: middle;
        animation: txBlink 0.7s step-end infinite;
      }

      .state-label {
        font-family: ui-monospace, "SFMono-Regular", SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.5;
        color: #e9d5ff;
        margin-top: 16px;
      }

      .demo-btns {
        display: flex;
        gap: 8px;
        margin-top: 48px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .demo-btn {
        font-family: ui-monospace, "SFMono-Regular", SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: lowercase;
        padding: 7px 14px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.45);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .demo-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.75);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .demo-btn.active {
        background: rgba(167, 139, 250, 0.12);
        border-color: rgba(167, 139, 250, 0.35);
        color: #c4b5fd;
      }

      .demo-btn.active[data-s="listening"] {
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }

      .demo-btn.active[data-s="speaking"] {
        background: rgba(147, 51, 234, 0.12);
        border-color: rgba(147, 51, 234, 0.35);
        color: #d8b4fe;
      }
    </style>
  </head>
  <body>
    <div class="vo-root">
      <div class="orb-stack">
        <div class="ring1"></div>
        <div class="ring2"></div>
        <div class="ring3"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-ring2"></div>
        <div id="orb" class="orb"></div>
      </div>

      <div id="wave-wrap" class="wave-wrap">
        <canvas id="wave" width="153" height="52" style="display: block; margin: 0 auto"></canvas>
      </div>

      <div class="transcript-wrap">
        <div id="transcript-inner" class="transcript-inner"></div>
      </div>

      <div id="state-label" class="state-label">connecting</div>

      <div class="demo-btns">
        <button class="demo-btn" data-s="idle">idle</button>
        <button class="demo-btn" data-s="connecting">connecting</button>
        <button class="demo-btn" data-s="listening">listening</button>
        <button class="demo-btn" data-s="speaking">speaking</button>
      </div>
    </div>

    <script>
      const CFG = {
        idle: {
          label: "idle",
          orbColor: ["#c4b5fd", "#7c3aed", "#3b0764"],
          glowRgb: "124,58,237",
          glowAlpha: 0.18,
          scale: 1,
          rings: true,
          spinner: false,
          waveform: false,
          barRgb: [167, 139, 250],
          barAmplitude: 0.15,
        },
        booting: {
          label: "connecting",
          orbColor: ["#ddd6fe", "#7c3aed", "#3b0764"],
          glowRgb: "124,58,237",
          glowAlpha: 0.12,
          scale: 1,
          rings: false,
          spinner: true,
          waveform: false,
          barRgb: [167, 139, 250],
          barAmplitude: 0,
        },
        connecting: {
          label: "connecting",
          orbColor: ["#ddd6fe", "#7c3aed", "#3b0764"],
          glowRgb: "124,58,237",
          glowAlpha: 0.12,
          scale: 1,
          rings: false,
          spinner: true,
          waveform: false,
          barRgb: [167, 139, 250],
          barAmplitude: 0,
        },
        thinking: {
          label: "thinking",
          orbColor: ["#ddd6fe", "#7c3aed", "#3b0764"],
          glowRgb: "124,58,237",
          glowAlpha: 0.16,
          scale: 1.01,
          rings: false,
          spinner: true,
          waveform: false,
          barRgb: [167, 139, 250],
          barAmplitude: 0,
        },
        listening: {
          label: "listening",
          orbColor: ["#fca5a5", "#dc2626", "#7f1d1d"],
          glowRgb: "220,38,38",
          glowAlpha: 0.45,
          scale: 1.04,
          rings: false,
          spinner: false,
          waveform: true,
          barRgb: [248, 113, 113],
          barAmplitude: 0.92,
        },
        speaking: {
          label: "speaking",
          orbColor: ["#e9d5ff", "#9333ea", "#581c87"],
          glowRgb: "147,51,234",
          glowAlpha: 0.5,
          scale: 1.08,
          rings: false,
          spinner: false,
          waveform: true,
          barRgb: [192, 132, 252],
          barAmplitude: 0.75,
        },
      };

      const N = 26;
      const BAR_W = 3;
      const BAR_GAP = 3;
      const CW = N * (BAR_W + BAR_GAP) - BAR_GAP;
      const CH = 52;

      const els = {
        orb: document.getElementById("orb"),
        label: document.getElementById("state-label"),
        waveWrap: document.getElementById("wave-wrap"),
        wave: document.getElementById("wave"),
        transcriptInner: document.getElementById("transcript-inner"),
        rings: [
          document.querySelector(".ring1"),
          document.querySelector(".ring2"),
          document.querySelector(".ring3"),
        ],
        spinners: [
          document.querySelector(".spinner-ring"),
          document.querySelector(".spinner-ring2"),
        ],
        buttons: Array.from(document.querySelectorAll(".demo-btn")),
      };

      class Waveform {
        constructor(canvas) {
          this.canvas = canvas;
          this.ctx = canvas.getContext("2d");
          this.state = "connecting";
          this.heights = new Float32Array(N).fill(3);
          this.targets = new Float32Array(N).fill(3);
          this.nextTick = 0;
          this.raf = requestAnimationFrame(this.tick.bind(this));
        }

        setState(next) {
          this.state = next in CFG ? next : "idle";
        }

        tick(ts) {
          this.raf = requestAnimationFrame(this.tick.bind(this));
          const cfg = CFG[this.state] || CFG.idle;

          if (ts > this.nextTick) {
            const interval = cfg.waveform ? 70 + Math.random() * 100 : 600;
            this.nextTick = ts + interval;
            const maxH = CH * cfg.barAmplitude;
            for (let i = 0; i < N; i++) {
              if (!cfg.waveform) {
                this.targets[i] = 2 + Math.random() * 2;
              } else if (this.state === "listening") {
                this.targets[i] = 3 + Math.random() * maxH;
              } else {
                const wave = Math.sin((i / N) * Math.PI * 3 + ts * 0.0018);
                this.targets[i] = 3 + (wave * 0.5 + 0.5 + Math.random() * 0.25) * maxH;
              }
            }
          }

          const lerp = cfg.waveform ? 0.18 : 0.06;
          for (let i = 0; i < N; i++) {
            this.heights[i] += (this.targets[i] - this.heights[i]) * lerp;
          }

          this.ctx.clearRect(0, 0, CW, CH);
          const [r, g, b] = cfg.barRgb;
          for (let i = 0; i < N; i++) {
            const h = Math.max(2, this.heights[i]);
            const x = i * (BAR_W + BAR_GAP);
            const y = (CH - h) / 2;
            this.ctx.fillStyle = `rgba(${r},${g},${b},${cfg.waveform ? 0.9 : 0.25})`;
            this.roundRect(x, y, BAR_W, h, 1.5);
            this.ctx.fill();
          }
        }

        roundRect(x, y, w, h, r) {
          const ctx = this.ctx;
          ctx.beginPath();
          if (typeof ctx.roundRect === "function") {
            ctx.roundRect(x, y, w, h, r);
            return;
          }
          const rr = Math.min(r, w / 2, h / 2);
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
        }
      }

      const waveform = new Waveform(els.wave);
      let state = "connecting";
      let lineId = 0;

      function applyState(next) {
        state = next in CFG ? next : "idle";
        const cfg = CFG[state];

        els.orb.className = `orb orb-${state}`;
        els.orb.style.background = `radial-gradient(circle at 38% 36%, ${cfg.orbColor[0]}, ${cfg.orbColor[1]} 55%, ${cfg.orbColor[2]})`;
        els.orb.style.boxShadow = `0 0 0 1px rgba(${cfg.glowRgb},0.35), 0 0 40px 12px rgba(${cfg.glowRgb},${cfg.glowAlpha}), inset 0 1px 0 rgba(255,255,255,0.15)`;
        els.orb.style.transform = `scale(${cfg.scale})`;

        els.rings.forEach((el) => {
          el.style.display = cfg.rings ? "block" : "none";
        });
        els.spinners.forEach((el) => {
          el.style.display = cfg.spinner ? "block" : "none";
        });

        els.waveWrap.style.opacity = cfg.waveform ? "1" : "0.18";
        els.label.textContent = cfg.label;
        waveform.setState(state);

        els.buttons.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.s === state);
        });
      }

      function updateTranscriptShift() {
        const count = els.transcriptInner.children.length;
        const maxVisible = 3;
        const lineH = 28;
        if (count > maxVisible) {
          els.transcriptInner.style.transform = `translateY(-${(count - maxVisible) * lineH}px)`;
        } else {
          els.transcriptInner.style.transform = "translateY(0)";
        }
      }

      function markLastLine() {
        const children = Array.from(els.transcriptInner.children);
        children.forEach((child, idx) => {
          child.classList.toggle("last", idx === children.length - 1);
        });
      }

      function addLine(role, text) {
        const clean = String(text || "").trim();
        if (!clean) return;

        const line = document.createElement("div");
        line.className = "tx-line last";
        line.dataset.id = String(++lineId);

        const dot = document.createElement("div");
        dot.className = "tx-dot";
        dot.style.background = role === "user" ? "rgba(248,113,113,0.7)" : "rgba(192,132,252,0.65)";

        const span = document.createElement("span");
        span.className = "tx-text";

        const cursor = document.createElement("span");
        cursor.className = "tx-cursor";

        line.appendChild(dot);
        line.appendChild(span);
        els.transcriptInner.appendChild(line);
        markLastLine();

        let idx = 0;
        const iv = setInterval(() => {
          idx += 1;
          span.textContent = clean.slice(0, idx);
          if (idx >= clean.length) {
            clearInterval(iv);
            if (line.classList.contains("last")) {
              span.appendChild(cursor);
              requestAnimationFrame(() => {
                cursor.remove();
              });
            }
          } else if (line.classList.contains("last") && !cursor.isConnected) {
            span.appendChild(cursor);
          }
        }, 28);

        while (els.transcriptInner.children.length > 12) {
          els.transcriptInner.removeChild(els.transcriptInner.firstChild);
        }

        updateTranscriptShift();
      }

      function consumeEvent(payload) {
        if (!payload || typeof payload !== "object") return;
        if (payload.type === "state" && payload.value) {
          applyState(payload.value);
          return;
        }
        if (payload.type === "transcript") {
          addLine(payload.role === "user" ? "user" : "agent", payload.text);
        }
      }

      els.buttons.forEach((btn) => {
        btn.addEventListener("click", () => applyState(btn.dataset.s));
      });

      window.addEventListener("message", (event) => {
        consumeEvent(event.data || {});
      });

      try {
        const es = new EventSource("/events");
        es.onmessage = (event) => {
          try {
            consumeEvent(JSON.parse(event.data));
          } catch (_err) {
            /* ignore */
          }
        };
      } catch (_err) {
        /* ignore */
      }

      applyState("connecting");
    </script>
  </body>
</html>
